<div class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm">

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Expiry Manager</h1>
      <p class="text-sm text-gray-500 mt-1">Faça login para continuar</p>
    </div>

    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          placeholder="seu@email.com"
          [(ngModel)]="email"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input
          type="password"
          placeholder="••••••••"
          [(ngModel)]="password"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        (click)="onLogin()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition-colors">
        Entrar
      </button>
    </div>

  </div>
</div>
